name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NINJA_REFERENCE_COMMIT: b51a1e37c2fb89bbefa600bd155e1ce13983f09d

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Ninja
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
          git -C ninja-reference checkout "$NINJA_REFERENCE_COMMIT"
          cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ninja-reference/build --parallel 2
      - name: Test
        shell: bash
        run: |
          export KNIGHT_NINJA="$PWD/ninja-reference/build/ninja"
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Ninja
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
          git -C ninja-reference checkout $env:NINJA_REFERENCE_COMMIT
          cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ninja-reference/build --config Release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          $env:KNIGHT_NINJA = "$pwd\ninja-reference\build\Release\ninja.exe"
          cargo test --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
