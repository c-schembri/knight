name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NINJA_REFERENCE_COMMIT: b51a1e37c2fb89bbefa600bd155e1ce13983f09d

jobs:
  cross-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-unknown-illumos
          - x86_64-pc-solaris
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Check ${{ matrix.target }}
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          cargo check --target "${{ matrix.target }}" --all-targets

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        with:
          release: "14.3"
          usesh: true
          envs: NINJA_REFERENCE_COMMIT CARGO_TERM_COLOR
          prepare: pkg install -y rust git cmake python3
          run: |
            git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
            git -C ninja-reference checkout "$NINJA_REFERENCE_COMMIT"
            cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNINJA_PYTHON=python3
            cmake --build ninja-reference/build --parallel 2
            export KNIGHT_NINJA="$PWD/ninja-reference/build/ninja"
            cargo test --all-targets
            cargo clippy --all-targets -- -D warnings
            cargo build --release

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test on OpenBSD
        uses: vmactions/openbsd-vm@e6c68b637a12e83519688d115d57d5b0b53923cd # v1
        with:
          release: "7.8"
          usesh: true
          envs: NINJA_REFERENCE_COMMIT CARGO_TERM_COLOR
          prepare: pkg_add rust rust-clippy git cmake python
          run: |
            git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
            git -C ninja-reference checkout "$NINJA_REFERENCE_COMMIT"
            cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNINJA_PYTHON=python3
            cmake --build ninja-reference/build --parallel 2
            export KNIGHT_NINJA="$PWD/ninja-reference/build/ninja"
            ulimit -n 4096
            cargo test --all-targets
            cargo clippy --all-targets -- -D warnings
            cargo build --release

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test on NetBSD
        uses: vmactions/netbsd-vm@00081e82b14bc40114eb97f32b4455306828516b # v1
        with:
          release: "10.1"
          envs: NINJA_REFERENCE_COMMIT CARGO_TERM_COLOR
          prepare: |
            /usr/sbin/pkg_add -u rust git cmake python313
            ln -sf /usr/pkg/bin/python3.13 /usr/pkg/bin/python3
          run: |
            git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
            git -C ninja-reference checkout "$NINJA_REFERENCE_COMMIT"
            cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNINJA_PYTHON=python3.13
            cmake --build ninja-reference/build --parallel 2
            export KNIGHT_NINJA="$PWD/ninja-reference/build/ninja"
            ulimit -n 4096
            cargo test --all-targets
            cargo test --test differential subprocess_set_supports_more_than_1024_parallel_processes -- --exact --ignored --test-threads=1
            cargo build --release

  dragonflybsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test on DragonFly BSD
        uses: vmactions/dragonflybsd-vm@bc8ccbaa091ce3624c93f2dc328ae48129b07580 # v1.3.1
        with:
          release: "6.4.2"
          envs: NINJA_REFERENCE_COMMIT CARGO_TERM_COLOR
          prepare: pkg install -y rust git cmake python3
          run: |
            git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
            git -C ninja-reference checkout "$NINJA_REFERENCE_COMMIT"
            cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DNINJA_PYTHON=python3
            cmake --build ninja-reference/build --parallel 2
            export KNIGHT_NINJA="$PWD/ninja-reference/build/ninja"
            ulimit -n 8192
            cargo test --all-targets
            cargo test --test differential subprocess_set_supports_more_than_1024_parallel_processes -- --exact --ignored --test-threads=1
            cargo clippy --all-targets -- -D warnings
            cargo build --release

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned Ninja
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
          git -C ninja-reference checkout "$NINJA_REFERENCE_COMMIT"
          cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build ninja-reference/build --parallel 2
      - name: Test
        shell: bash
        run: |
          export KNIGHT_NINJA="$PWD/ninja-reference/build/ninja"
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned Ninja
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/ninja-build/ninja.git ninja-reference
          git -C ninja-reference checkout $env:NINJA_REFERENCE_COMMIT
          cmake -S ninja-reference -B ninja-reference/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build ninja-reference/build --config Release --parallel 2
      - name: Test
        shell: pwsh
        run: |
          $env:KNIGHT_NINJA = "$pwd\ninja-reference\build\Release\ninja.exe"
          cargo test --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
